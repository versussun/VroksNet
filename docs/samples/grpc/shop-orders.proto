// Two services in one file, importing a sibling file and the well-known types.
// Covers nested messages, an enum, repeated and map fields, a oneof, proto3 optional,
// 64-bit integers and a server-streaming method.
syntax = "proto3";

package shop.orders.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "common/money.proto";

service Orders {
  rpc GetOrder (GetOrderRequest) returns (Order);
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse);
  // Streams every change to the customer's orders.
  rpc WatchOrders (WatchOrdersRequest) returns (stream Order);
}

service Payments {
  rpc Pay (PayRequest) returns (google.protobuf.Empty);
}

message GetOrderRequest {
  string order_id = 1;
}

message ListOrdersRequest {
  string customer_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  string next_page_token = 2;
}

message WatchOrdersRequest {
  string customer_id = 1;
}

message PayRequest {
  string order_id = 1;
  oneof method {
    string card_token = 2;
    string invoice_number = 3;
  }
}

message Order {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    NEW = 1;
    PAID = 2;
    SHIPPED = 3;
  }

  message Line {
    string sku = 1;
    int32 quantity = 2;
    shop.common.v1.Money unit_price = 3;
  }

  string id = 1;
  string customer_id = 2;
  Status status = 3;
  repeated Line lines = 4;
  shop.common.v1.Money total = 5;
  map<string, string> labels = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.StringValue note = 8;
  optional int64 version = 9;
}
