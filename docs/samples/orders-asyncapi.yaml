# Placeholder sample spec for local testing — NOT a real service spec.
# Swap in specs from your own services (see docs/project-brief.md section 6 "Первые шаги").
# AsyncAPI parsing itself isn't implemented yet (Phase 01/03) — this file is here so it's ready
# to use once it is.
asyncapi: 3.0.0
info:
  title: Orders Sample Events
  version: "1.0.0"
  description: A tiny placeholder AsyncAPI spec used to exercise VroksNet's async mock pipeline locally.
servers:
  rabbitmq:
    host: rabbitmq:5672
    protocol: amqp
channels:
  orderCreated:
    address: orders.created
    messages:
      OrderCreated:
        payload:
          type: object
          required: [orderId, createdAt]
          properties:
            orderId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            total:
              type: number
operations:
  sendOrderCreated:
    action: send
    channel:
      $ref: "#/channels/orderCreated"
