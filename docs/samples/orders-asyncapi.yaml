# Sample spec for local testing — NOT a real service spec. See docs/samples/README.md.
#
# The smallest AsyncAPI 3.0 spec VroksNet gets everything out of: one operation
# ("orders.created:send") whose `messages` points at the channel's message, which carries a
# payload schema and an example. Without the operation's `messages` list there'd be no example to
# publish and no schema to check against. Works with any broker connection: the address is the
# RabbitMQ routing key, the NATS subject or the Kafka topic.
asyncapi: 3.0.0
info:
  title: Orders Sample Events
  version: "1.1.0"
  description: A tiny AsyncAPI spec used to exercise VroksNet's async mock pipeline locally.
channels:
  orderCreated:
    address: orders.created
    messages:
      orderCreated:
        payload:
          type: object
          required: [orderId, createdAt]
          properties:
            orderId:
              type: string
            createdAt:
              type: string
              format: date-time
            total:
              type: number
        examples:
          - payload:
              orderId: "{{uuid}}"
              createdAt: "{{now}}"
              total: 42.5
operations:
  sendOrderCreated:
    action: send
    channel:
      $ref: "#/channels/orderCreated"
    messages:
      - $ref: "#/channels/orderCreated/messages/orderCreated"
