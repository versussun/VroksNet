# Sample spec for local testing — NOT a real service spec. See docs/samples/README.md.
#
# AsyncAPI 3.0 for Azure Service Bus. The channel address is the queue or topic name; Service Bus
# names have no wildcards, so there are no channel parameters here. Both entities exist in the
# AppHost's Service Bus emulator:
# - warehouse.picking.requested: a queue. Send only — its consumers compete for messages, so
#   listening on it would take them away.
# - warehouse.stock.changed: a topic. Send publishes to it; Listen reads a subscription. The
#   emulator can't create a temporary one, so name its "vroksnet" subscription in the broker option
#   "subscription". Against Azure, leave it blank to get a temporary subscription per run (the
#   connection then needs Manage rights).
asyncapi: 3.0.0
info:
  title: Warehouse Service Bus Sample
  version: "1.0.0"
  description: Picking requests go to a queue; stock changes are published to a topic.
servers:
  local:
    host: localhost:5672
    protocol: servicebus
    description: The AppHost "servicebus" emulator (its connection string is in the Aspire dashboard).
channels:
  pickingRequested:
    address: warehouse.picking.requested
    description: A queue — Send only.
    messages:
      pickingRequested:
        $ref: "#/components/messages/PickingRequested"
  stockChanged:
    address: warehouse.stock.changed
    description: A topic — Listen through a subscription.
    messages:
      stockChanged:
        $ref: "#/components/messages/StockChanged"
operations:
  requestPicking:
    action: receive
    channel:
      $ref: "#/channels/pickingRequested"
    summary: The warehouse service picks orders from this queue — send one as the order service would.
    messages:
      - $ref: "#/channels/pickingRequested/messages/pickingRequested"
  publishStockChanged:
    action: send
    channel:
      $ref: "#/channels/stockChanged"
    summary: The warehouse service publishes every stock change — listen here to check them.
    messages:
      - $ref: "#/channels/stockChanged/messages/stockChanged"
components:
  messages:
    PickingRequested:
      name: PickingRequested
      payload:
        $ref: "#/components/schemas/PickingRequested"
      examples:
        - payload:
            requestId: "{{uuid}}"
            orderId: "ord-1001"
            lines:
              - sku: "SKU-RED-MUG"
                quantity: 2
            requestedAt: "{{now}}"
    StockChanged:
      name: StockChanged
      payload:
        $ref: "#/components/schemas/StockChanged"
      examples:
        - payload:
            sku: "SKU-RED-MUG"
            site: "berlin-1"
            available: 41
            changedAt: "{{now}}"
  schemas:
    PickingRequested:
      type: object
      required: [requestId, orderId, lines, requestedAt]
      properties:
        requestId:
          type: string
        orderId:
          type: string
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku:
                type: string
              quantity:
                type: integer
                minimum: 1
        requestedAt:
          type: string
          format: date-time
    StockChanged:
      type: object
      required: [sku, site, available, changedAt]
      properties:
        sku:
          type: string
        site:
          type: string
        available:
          type: integer
          minimum: 0
        changedAt:
          type: string
          format: date-time
