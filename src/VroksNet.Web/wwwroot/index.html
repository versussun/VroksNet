<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VroksNet</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="VroksNet.Web.styles.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/png" href="favicon.png" />
    <script>
        // Applied synchronously, before anything paints, so there's no flash of the wrong theme
        // while Blazor boots. Mirrors window.vroksnetTheme.set (js/theme.js) but inlined here —
        // that script tag loads too late (after <body>) to run before first paint.
        (function () {
            var stored = null;
            try { stored = localStorage.getItem("vroksnet-theme"); } catch { }
            var theme = stored || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-bs-theme", theme);
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="loading-indicator">Loading...</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="js/theme.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
