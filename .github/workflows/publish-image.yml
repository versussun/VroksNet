name: Publish image

# Builds the Docker image and publishes it to GHCR (ghcr.io/versussun/vroksnet). Tags, per
# docs/container-contract.md §2:
#   - a push to master       → `master`, `sha-<commit>`
#   - a release tag vX.Y.Z   → `X.Y.Z`, `X.Y`, `latest` (so `latest` is always a release)
# Every run first builds the amd64 image locally and verifies it against the container contract
# (scripts/verify-container-contract.sh, docs/container-contract.md §9); nothing is pushed unless
# that passes. On pull requests that touch the image, that's all it does, so a broken Dockerfile
# or a contract-breaking change shows up before the merge.
on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/publish-image.yml
      - Directory.Packages.props
      - 'src/**'
      - 'docs/samples/**'
      - 'docs/schemas/**'
      - scripts/verify-container-contract.sh
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vroksnet

jobs:
  image:
    name: Build, verify & publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Only the final stage is per-platform (see the Dockerfile header); QEMU runs just its apt step.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      # The app version stamped into the assembly: the release version for a tag, otherwise a
      # pre-release marker with the commit, e.g. 0.0.0-master.1a2b3c4.
      - name: App version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-${GITHUB_REF_NAME//\//-}.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # The contract check runs the image, so it needs one loaded into the local daemon: amd64
      # only (the runner's platform). The multi-arch build below reuses its layers from the cache.
      - name: Build image for the contract check
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: vroksnet:contract-check
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the container contract
        run: scripts/verify-container-contract.sh vroksnet:contract-check

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
