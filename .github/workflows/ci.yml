name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A new push to the same PR/branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

# Three parallel jobs, so the fast unit tests don't wait for the broker containers the
# integration and E2E tests boot through the AppHost. Each job builds on its own; the build is
# quick next to the container start-up.
#
# Tests run the built test assembly directly (xUnit v3 on Microsoft.Testing.Platform) rather than
# through `dotnet test`, which only prints "Failed: N" here and hides which test failed and why.
jobs:
  unit:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - run: dotnet restore VroksNet.slnx
      - run: dotnet build VroksNet.slnx --no-restore
      - run: dotnet tests/VroksNet.UnitTests/bin/Debug/net10.0/VroksNet.UnitTests.dll

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      # ApiService serves https with the ASP.NET Core dev certificate, and the tests call it over
      # https. On Linux, --trust puts the certificate in ~/.aspnet/dev-certs/trust, which OpenSSL
      # only reads when it's on SSL_CERT_DIR.
      - name: Trust the dev certificate
        # Exit code 4 means "trusted by some clients but not others": OpenSSL (what .NET uses)
        # trusts it, the browsers' NSS store doesn't. That's enough here, so 4 counts as success.
        run: |
          dotnet dev-certs https --trust || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 4 ]; then exit "$code"; fi
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - run: dotnet restore VroksNet.slnx
      - run: dotnet build VroksNet.slnx --no-restore
      # Boots the real AppHost graph: RabbitMQ, NATS and Kafka run as Docker containers. Broker
      # families added later (tests/VroksNet.IntegrationTests/Brokers/<Family>) boot their own
      # graph and run in "Broker integration" below, so they don't add minutes to this job.
      - run: dotnet tests/VroksNet.IntegrationTests/bin/Debug/net10.0/VroksNet.IntegrationTests.dll --filter-not-namespace "VroksNet.IntegrationTests.Brokers.*"

  # One entry per broker family added after the core three (step R6 of
  # docs/broker-adapters-plan.md): each boots only its own broker. Not a required check until it
  # has proven stable. Add a family: .claude/rules/integration-tests.md.
  broker-integration:
    name: Broker integration (${{ matrix.family }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # images: a family's large container images, pulled before the tests — pulled during the
        # fixture's start, an image over a gigabyte can outlast its 2-minute budget. The tags are
        # the ones AppHost runs (for ServiceBus, what Aspire.Hosting.Azure.ServiceBus 13.6 runs).
        include:
          - family: Mqtt
          - family: Redis
          - family: ServiceBus
            images: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.0 mcr.microsoft.com/mssql/server:2022-latest
          - family: Aws
            images: localstack/localstack:4.14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Trust the dev certificate
        run: |
          dotnet dev-certs https --trust || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 4 ]; then exit "$code"; fi
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"
      - run: dotnet restore VroksNet.slnx
      - run: dotnet build VroksNet.slnx --no-restore
      - name: Pull the family's images
        if: matrix.images
        run: for image in ${{ matrix.images }}; do docker pull "$image"; done
      - run: dotnet tests/VroksNet.IntegrationTests/bin/Debug/net10.0/VroksNet.IntegrationTests.dll --filter-namespace "VroksNet.IntegrationTests.Brokers.${{ matrix.family }}"

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      # The browser ignores certificate errors (PageTestBase), but ApiService still needs a dev
      # certificate to serve https at all.
      - name: Trust the dev certificate
        # Exit code 4 means "trusted by some clients but not others": OpenSSL (what .NET uses)
        # trusts it, the browsers' NSS store doesn't. That's enough here, so 4 counts as success.
        run: |
          dotnet dev-certs https --trust || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 4 ]; then exit "$code"; fi
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - run: dotnet restore VroksNet.slnx
      - run: dotnet build VroksNet.slnx --no-restore

      - name: Install Playwright Chromium
        run: pwsh tests/VroksNet.E2ETests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - run: dotnet tests/VroksNet.E2ETests/bin/Debug/net10.0/VroksNet.E2ETests.dll
